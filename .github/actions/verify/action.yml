name: Verify AutoGovern2Code receipt
description: Validate a governed commit and optionally rerun its trusted checks

inputs:
  commit:
    description: Governed commit to verify
    required: false
    default: HEAD
  rerun:
    description: Rerun the trusted checker plan recorded by AG2C
    required: false
    default: "true"
  version:
    description: AutoGovern2Code release tag or installed package version
    required: false
    default: v0.4.0

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: Install AutoGovern2Code
      shell: bash
      run: |
        package_version="${{ inputs.version }}"
        package_version="${package_version#v}"
        python -m pip install "autogovern2code==${package_version}" || \
          python -m pip install "git+https://github.com/Holosukiyaa/AutoGovern2Code.git@${{ inputs.version }}"
    - name: Verify governed commit
      shell: bash
      run: |
        rerun=""
        if [ "${{ inputs.rerun }}" = "true" ]; then
          rerun="--rerun"
        fi
        ag2c ci verify --commit "${{ inputs.commit }}" ${rerun}
