name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: deg --version
      - name: Run minimal example
        working-directory: examples/minimal
        run: |
          deg index build
          deg index findings
          deg slice --path app:src/client.py --contract app:example.hello@1.0.0 --output .deg/state/slice.md
          deg check --path app:src/client.py --contract app:example.hello@1.0.0
          deg ledger verify
