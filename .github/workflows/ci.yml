name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: ag2c --version
      - name: Run minimal example
        working-directory: examples/minimal
        run: |
          ag2c --manifest ../minimal-governance/manifest.json index build
          ag2c --manifest ../minimal-governance/manifest.json index findings
          ag2c --manifest ../minimal-governance/manifest.json slice --path app:src/client.py --contract app:example.hello@1.0.0 --output ../minimal-governance/.state/slice.md
          ag2c --manifest ../minimal-governance/manifest.json check --path app:src/client.py --contract app:example.hello@1.0.0
          ag2c --manifest ../minimal-governance/manifest.json ledger verify

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: ag2c --version
      - run: ag2c setup --skill-destination .tmp-skills
      - run: test -f .tmp-skills/ag2c-governed-development/SKILL.md

  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install portable build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
      - name: Build the no-install Windows portable zip
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); import ag2c; print(ag2c.__version__)"
          ./scripts/build_windows_portable.ps1 -Version $version
      - name: Smoke-test portable enrollment, guard, and folder relocation
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); import ag2c; print(ag2c.__version__)"
          ./scripts/test_windows_portable.ps1 `
            -ZipPath build/windows/portable/AutoGovern2Code-Portable-Windows-x64.zip `
            -Version $version
