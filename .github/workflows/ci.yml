name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: ag2c --version
      - name: Run minimal example
        working-directory: examples/minimal
        run: |
          ag2c index build
          ag2c index findings
          ag2c slice --path app:src/client.py --contract app:example.hello@1.0.0 --output .ag2c/state/slice.md
          ag2c check --path app:src/client.py --contract app:example.hello@1.0.0
          ag2c ledger verify

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: ag2c --version
      - run: ag2c skill install --destination .tmp-skills
      - run: test -f .tmp-skills/ag2c-governed-development/SKILL.md
