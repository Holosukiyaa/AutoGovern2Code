name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  python-distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - uses: actions/upload-artifact@v6
        with:
          name: python-distributions
          path: dist/
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: ag2c --version

  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install portable build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
      - name: Build and smoke-test the no-install Windows portable zip
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./scripts/build_windows_portable.ps1 -Version $version
          ./scripts/test_windows_portable.ps1 `
            -ZipPath build/windows/portable/AutoGovern2Code-Portable-Windows-x64.zip `
            -Version $version
      - uses: actions/upload-artifact@v6
        with:
          name: windows-portable
          path: build/windows/portable/AutoGovern2Code-Portable-Windows-x64.zip

  release:
    needs: [python-distributions, windows-portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: sha256sum release-assets/* > release-assets/SHA256SUMS.txt
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes --title "AutoGovern2Code $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
