[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autogovern2code"
version = "0.8.4"
description = "Local governance layer for AI coding agents: isolate, check, and merge only verified bytes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "AutoGovern2Code contributors" }
]
keywords = ["governance", "developer-tools", "ai-agents", "codex", "claude-code", "git-worktree", "verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/Holosukiyaa/AutoGovern2Code#readme"
Issues = "https://github.com/Holosukiyaa/AutoGovern2Code/issues"
Source = "https://github.com/Holosukiyaa/AutoGovern2Code"

[project.scripts]
ag2c = "ag2c.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ag2c = ["py.typed", "skills/*/SKILL.md", "skills/*/agents/*.yaml", "ui/*.html", "ui/*.css", "ui/*.js", "ui/vendor/*"]
